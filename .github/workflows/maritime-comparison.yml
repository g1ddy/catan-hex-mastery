name: Generated Artifacts

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generated-artifacts-${{ github.repository }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: false

env:
  GENERATED_COMMITS: 'false'
  MARITIME_BETA8_COMMIT: '83dadbdc6718264060f82cad02197671abd76e29'
  MARITIME_BETA8_VERSION: '0.1.0-beta.8'

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Catan
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Plan generated artifacts
        id: plan
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { appendFileSync, readFileSync } = require('node:fs');

          const eventName = process.env.GITHUB_EVENT_NAME;
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const action = event.action ?? '';
          const pullRequest = event.pull_request;
          const normalPrAction = ['opened', 'reopened', 'synchronize'].includes(action);
          const runMaritime = eventName === 'workflow_dispatch' || (eventName === 'pull_request' && normalPrAction);

          let runScreenshots = false;
          if (eventName === 'pull_request' && normalPrAction && pullRequest?.base?.ref === 'main') {
            const changedFiles = execFileSync(
              'git',
              ['diff', '--name-only', pullRequest.base.sha, pullRequest.head.sha],
              { encoding: 'utf8' },
            ).trim().split('\n').filter(Boolean);

            const screenshotInputs = new Set([
              'config/playwright.screenshots.config.ts',
              'docs/scripts/generate_screenshots.spec.ts',
              'index.html',
              'package.json',
              'package-lock.json',
              'postcss.config.js',
              'tailwind.config.js',
              'vite.config.ts',
            ]);

            runScreenshots = changedFiles.some((path) => (
              path.startsWith('src/')
              || path.startsWith('public/')
              || screenshotInputs.has(path)
            ));
          }

          const any = runMaritime || runScreenshots;
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `run_maritime=${runMaritime}`,
            `run_screenshots=${runScreenshots}`,
            `any=${any}`,
          ].join('\n') + '\n');
          NODE

      - name: Use Node.js for Maritime
        if: steps.plan.outputs.run_maritime == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Use repository Node.js
        if: steps.plan.outputs.run_maritime != 'true' && steps.plan.outputs.run_screenshots == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Catan dependencies
        if: steps.plan.outputs.any == 'true'
        run: npm ci

      - name: Configure generated-artifact committer
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.plan.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Checkout merged Maritime beta.8 candidate
        if: steps.plan.outputs.run_maritime == 'true'
        uses: actions/checkout@v4
        with:
          repository: g1ddy/dependency-maritime
          ref: ${{ env.MARITIME_BETA8_COMMIT }}
          path: .maritime-cli-source

      - name: Build beta.8 candidate exactly from merged Maritime source
        if: steps.plan.outputs.run_maritime == 'true'
        working-directory: .maritime-cli-source
        run: |
          npm ci
          npm version "$MARITIME_BETA8_VERSION" --no-git-tag-version
          npm run build:cli

      - name: Analyze and render with merged Maritime compact profile
        if: steps.plan.outputs.run_maritime == 'true'
        uses: g1ddy/dependency-maritime@83dadbdc6718264060f82cad02197671abd76e29
        with:
          node-version: '22.13.0'
          cli-source: '.maritime-cli-source'
          source-roots: 'src'
          depcruise-config: 'config/dependency-cruiser.maritime.cjs'
          output-dir: '.maritime'
          fail-on-unmeasured: 'true'
          render-graph: 'true'
          graph-output: 'docs/images/dependency-graph.svg'
          graph-profile: 'compact-architecture'
          upload-artifact: 'false'

      - name: Verify compact evidence and reference fidelity
        if: steps.plan.outputs.run_maritime == 'true'
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const artifact = JSON.parse(readFileSync('.maritime/dependency-graph.json', 'utf8'));
          const dependencies = artifact.modules.flatMap((module) => module.dependencies ?? []);
          const explicit = dependencies.filter((dependency) => dependency.preCompilationOnly === true).length;
          const tagged = dependencies.filter((dependency) => (
            Array.isArray(dependency.dependencyTypes)
            && dependency.dependencyTypes.includes('pre-compilation-only')
          )).length;
          if (explicit === 0 && tagged === 0) {
            throw new Error('canonical Catan evidence contains no distinguishable pre-compilation-only relationships');
          }
          console.log(`Pre-compilation evidence: ${explicit} explicit flags, ${tagged} dependency-type tags.`);
          NODE
          npm run test:layout
          npm run verify:maritime

      - name: Inspect Maritime outputs
        if: steps.plan.outputs.run_maritime == 'true'
        run: find .maritime -maxdepth 1 -type f -print

      - name: Upload Maritime beta.8 candidate artifacts
        if: steps.plan.outputs.run_maritime == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maritime-beta8-catan-gate
          path: |
            .maritime/
            docs/images/dependency-graph.reference.svg
            docs/images/dependency-graph.svg
          if-no-files-found: error
          include-hidden-files: true

      - name: Remove temporary Maritime source checkout
        if: steps.plan.outputs.run_maritime == 'true'
        run: rm -rf .maritime-cli-source

      - name: Commit Maritime comparison outputs locally
        if: steps.plan.outputs.run_maritime == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set +e
          node scripts/has-substantive-maritime-changes.cjs
          comparison_status=$?
          set -e

          case "$comparison_status" in
            0)
              echo "Maritime comparison outputs are already current."
              git restore -- .maritime docs/images/dependency-graph.svg
              ;;
            1)
              git add .maritime docs/images/dependency-graph.svg
              git commit -m "docs(metrics): update Maritime beta.8 candidate evidence"
              echo "GENERATED_COMMITS=true" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Maritime evidence comparison failed with status $comparison_status." >&2
              exit "$comparison_status"
              ;;
          esac

      - name: Restore repository Node.js for Catan generators
        if: steps.plan.outputs.run_maritime == 'true' && steps.plan.outputs.run_screenshots == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Build project for generated assets
        if: steps.plan.outputs.run_screenshots == 'true'
        run: npm run build

      - name: Install Playwright browsers
        if: steps.plan.outputs.run_screenshots == 'true'
        run: npx playwright install chromium

      - name: Generate documentation screenshots
        if: steps.plan.outputs.run_screenshots == 'true'
        run: npm run test:screenshots
        env:
          CI: true

      - name: Commit documentation screenshots locally
        if: steps.plan.outputs.run_screenshots == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git add docs/images/*.png
          if git diff --cached --quiet; then
            echo "Documentation screenshots are already current."
            exit 0
          fi
          git commit -m "docs(assets): update screenshots [skip ci]"
          echo "GENERATED_COMMITS=true" >> "$GITHUB_ENV"

      - name: Push generated artifact commits
        if: env.GENERATED_COMMITS == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: git push origin "HEAD:${HEAD_BRANCH}"
