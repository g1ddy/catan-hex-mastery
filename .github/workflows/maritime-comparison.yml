name: Maritime Comparison

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Catan
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install Catan dependencies
        run: npm ci

      - name: Analyze with Maritime
        uses: g1ddy/dependency-maritime@cli-v0.1.0-beta.2
        with:
          node-version: '22.13.0'
          source-roots: 'src'
          depcruise-config: 'config/dependency-cruiser.cjs'
          output-dir: '.maritime'
          fail-on-unmeasured: 'true'
          upload-artifact: 'false'

      - name: Inspect Maritime outputs
        run: find .maritime -maxdepth 1 -type f -print

      - name: Upload Maritime comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maritime-comparison
          path: .maritime/
          if-no-files-found: error
          include-hidden-files: true

      - name: Commit Maritime comparison outputs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- .maritime)" ]; then
            echo "Maritime comparison outputs are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .maritime
          git commit -m "docs(metrics): add Maritime comparison outputs"
          git push origin "HEAD:${HEAD_BRANCH}"
